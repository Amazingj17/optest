experiment:
  name: zenodo_full_rnc50_100_300_2026
  seed: 2026
dataset:
  roots:
    grapheonrl: data/raw/zenodo-18927122-derived
  grapheonrl_system_configs: data/raw/zenodo-18927122-derived
  # Complete supported Zenodo experiment population: 3 RNC scales × 2 resource modes.
  archive_task_counts: [50, 100, 300]
  split_manifest: data/manifests/grapheonrl_mixed_iid_seed7.json
  sampling: {grapheonrl: 1.0}
resources:
  mode: dataset
model:
  high: {hidden_dim: 128, learning_rate: 0.001, use_lstm: true, include_heft_features: true}
  low: {hidden_dim: 64, heads: 4, learning_rate: 0.0005, use_gat: true}
training:
  low_pretrain_episodes: 200
  joint_train_episodes: 800
  evaluation_interval: 100
  early_stop_patience: 5
  ppo: {gamma_high: 0.99, gae_lambda_high: 0.95, gamma_low: 0.95, gae_lambda_low: 0.90, clip_coef: 0.2, entropy_coef_high: 0.01, entropy_coef_low: 0.02, update_epochs: 4, batch_size: 64, lr_end_factor: 0.1, max_grad_norm: 1.0}
bc: {enabled: false, epochs: 1}
curriculum:
  stages:
    - {min_tasks: 50, max_tasks: 100, episodes: 300}
    - {min_tasks: 50, max_tasks: 300, episodes: 700}
reward: {communication_weight: 0.0, potential_based: false, potential_gamma: 0.99}
evaluation: {split: validation, deterministic: true, bootstrap_samples: 1000}
output_dir: outputs/zenodo_full_rnc50_100_300_2026
device: cuda
device_options:
  # Stable native CUDA LSTM path for the local RTX 3050 Ti / CuDNN stack.
  disable_cudnn: true
