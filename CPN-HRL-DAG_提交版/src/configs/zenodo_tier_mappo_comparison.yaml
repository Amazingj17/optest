experiment:
  name: zenodo_tier_mappo_comparison
  seed: 2026
baseline: tier_mappo
dataset:
  roots:
    grapheonrl: data/raw/zenodo-18927122-derived
  grapheonrl_system_configs: data/raw/zenodo-18927122-derived
  archive_task_counts: [50, 100, 300]
  split_manifest: data/manifests/grapheonrl_mixed_iid_seed7.json
resources:
  mode: dataset
environment:
  normalize_observations: true
model:
  hidden_dim: 32
  heads: 4
  task_layers: 1
  resource_layers: 1
  bid_temperature: 1.0
training:
  seed: 2026
  epochs: 3
  learning_rate: 0.0003
  ppo:
    gamma: 1.0
    gae_lambda: 0.95
    clip_coef: 0.2
    entropy_coef: 0.01
    value_coef: 0.5
    max_grad_norm: 0.5
    update_epochs: 4
    batch_size: 8
    target_kl: 0.03
evaluation:
  bootstrap_samples: 1000
output_dir: outputs/graph_baselines
device: auto
torch_num_threads: 1
