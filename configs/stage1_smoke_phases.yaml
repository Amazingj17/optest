# Stage-one SMOKE configuration: real data, real simulator, tiny budget.
# It exists to prove that explicit phase semantics, diagnostics, saving, loading
# and evaluation work end to end. It is NOT a formal result: two episodes cannot
# select a model, so its validation ratio must never be reported next to the
# fixed 108-scenario numbers. The dataset protocol (scales, manifest, resources)
# is deliberately the same frozen one the formal run uses.
#
#   python scripts/train_main_comparison.py --config configs/stage1_smoke_phases.yaml
experiment:
  name: stage1_smoke_phases_seed2026
  seed: 2026

dataset:
  roots:
    grapheonrl: data/raw/zenodo-18927122-derived
  grapheonrl_system_configs: data/raw/zenodo-18927122-derived
  archive_task_counts: [50, 100, 300]
  split_manifest: data/manifests/grapheonrl_mixed_iid_seed7.json

resources:
  mode: dataset

environment:
  normalize_observations: true

model:
  high:
    hidden_dim: 16
    learning_rate: 0.0001
    use_lstm: true
    include_heft_features: true
    heuristic_residual: true
    heuristic_weight: 8.0
    residual_limit: 0.5
  low:
    hidden_dim: 8
    heads: 2
    learning_rate: 0.00005
    use_gat: true
    heuristic_residual: true
    heuristic_weight: 8.0
    residual_limit: 0.5

training:
  phases:
    - {name: high_only_eft, episodes: 4}
    - {name: joint, episodes: 4}
  coverage_epochs: 1
  low_pretrain_episodes: 0
  high_train_episodes: 0
  joint_train_episodes: 0
  diagnostics: true
  evaluation_interval: 4
  early_stop_patience: 4
  ppo:
    gamma_high: 1.0
    gae_lambda_high: 0.95
    gamma_low: 1.0
    gae_lambda_low: 0.95
    clip_coef: 0.1
    entropy_coef_high: 0.001
    entropy_coef_low: 0.001
    update_epochs: 1
    batch_size: 4
    target_kl: 0.01
    value_clip_coef: 0.2
    lr_end_factor: 0.2
    max_grad_norm: 0.5

bc:
  enabled: false
  epochs: 1
  max_scenarios: 24

curriculum:
  stages: []

reward:
  type: normalized_makespan_delta
  communication_weight: 0.0
  potential_based: false
  potential_gamma: 1.0

evaluation:
  deterministic: true
  evaluate_initial: true
  proxy_scenarios: 0
  bootstrap_samples: 0

portfolio:
  perturbation_candidates: 16
  task_top_k: 2
  node_top_k: 2
  alternative_node_probability: 0.15

output_dir: outputs/stage1_smoke_seed2026
device: cpu
device_options:
  disable_cudnn: true
torch_num_threads: 4
