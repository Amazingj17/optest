experiment:
  name: zenodo_dag_pair_regret_dagger_smoke_2026
  seed: 2026
  result_scope: SMOKE TEST RESULT
  report_split: validation_smoke

dataset:
  roots:
    grapheonrl: data/raw/zenodo-18927122-derived
  grapheonrl_system_configs: data/raw/zenodo-18927122-derived
  archive_task_counts: [50, 100, 300]
  split_manifest: data/manifests/grapheonrl_mixed_iid_seed7.json
  sampling: {grapheonrl: 1.0}

resources:
  mode: dataset

model:
  dag_pair:
    hidden_dim: 24
    heads: 4
    task_layers: 1
    resource_layers: 1
    dropout: 0.0
    heuristic_residual: true
    # Conservative residual: the untrained model exactly reproduces HEFT and
    # learning can overturn only a small number of lexicographic prior gaps.
    residual_limit: 0.20
    heuristic_scale: 0.05

distillation:
  method: regret_dagger
  train_scenarios: 9
  validation_scenarios: 6
  epochs: 3
  states_per_scenario: 6
  max_candidate_actions: 5
  heuristic_task_candidates: 2
  heuristic_node_candidates: 2
  student_candidates: 2
  temperature: 0.02
  learning_rate: 0.0003
  weight_decay: 0.00001
  value_weight: 0.1
  expected_regret_weight: 1.0
  residual_weight: 0.05
  max_grad_norm: 1.0
  teacher_beta_start: 0.75
  teacher_beta_end: 0.25
  freeze_graph_encoders: true
  validation_policy: safe_search
  report_pure_policy: true
  early_stop_patience: 2
  early_stop_min_delta: 0.000001

# Canonical HEFT stays candidate zero.  The graph rollout is only one extra
# candidate, after which the same validated two-round LNS is applied.
search:
  include_peft: true
  peft_lookahead_weights: [0.0, 0.25]
  include_cpop: false
  heft_communication_scales: [0.0, 0.25, 2.0, 4.0]
  task_discrepancy_candidates: 0
  node_discrepancy_candidates: 1
  perturbation_candidates: 16
  task_top_k: 2
  node_top_k: 2
  alternative_node_probability: 0.15
  local_search_rounds: 2
  local_search_critical_tasks: 4
  local_search_node_alternatives: 1

evaluation:
  bootstrap_samples: 0

output_dir: outputs/zenodo_dag_pair_regret_dagger_smoke_2026
device: auto
