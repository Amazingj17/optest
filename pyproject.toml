[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cpn-hrl-dag"
version = "0.1.0"
description = "Reproducible cloud-edge-end DAG scheduling framework"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "networkx>=3.0",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
train = ["torch>=2.0"]
analysis = ["pandas>=2.0", "matplotlib>=3.7", "scipy>=1.9"]
dev = ["pytest>=7.0"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"

[tool.setuptools.packages.find]
where = ["src"]
